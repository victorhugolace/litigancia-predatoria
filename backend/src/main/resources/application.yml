server:
  port: 8080

spring:
  application:
    name: litigancia-predatoria
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:litigancia_predatoria}
    username: ${DB_USER:lyno}
    password: ${DB_PASSWORD:lyno}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      platform: postgres
  jackson:
    time-zone: America/Recife

logging:
  level:
    br.jus.tjpb.lyno.litigancia: INFO
