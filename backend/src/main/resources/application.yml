server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 51MB
  application:
    name: litigancia-predatoria
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:litigancia_predatoria}
    username: ${DB_USER:lyno}
    password: ${DB_PASSWORD:lyno}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    time-zone: America/Recife

logging:
  level:
    br.jus.tjpb.lyno.litigancia: INFO
