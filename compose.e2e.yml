services:
  db:
    image: postgres:16-alpine
    cpus: 0.50
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      POSTGRES_DB: litigancia_e2e
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d litigancia_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    image: litigancia-e2e-backend:latest
    cpus: 0.75
    mem_limit: 768m
    memswap_limit: 768m
    build: ./backend
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:ActiveProcessorCount=1"
      DB_HOST: db
      DB_NAME: litigancia_e2e
      DB_USER: test
      DB_PASSWORD: test
      SPRING_PROFILES_ACTIVE: demo
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/session > /dev/null"]
      interval: 3s
      timeout: 3s
      retries: 60
  frontend:
    image: litigancia-e2e-frontend:latest
    cpus: 0.25
    mem_limit: 64m
    memswap_limit: 64m
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/session > /dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
  browser-test:
    image: litigancia-e2e-browser-test:latest
    cpus: 1.0
    mem_limit: 768m
    memswap_limit: 768m
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    environment:
      BASE_URL: http://frontend
      CI: "true"
    shm_size: 128mb
    volumes:
      - ./frontend/e2e:/app/e2e:ro
      - ./frontend/playwright.config.ts:/app/playwright.config.ts:ro
      - ./doc:/references:ro
      - ./tmp/e2e:/app/test-results
    depends_on:
      frontend:
        condition: service_healthy
