services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: litigancia_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d litigancia_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
  backend-test:
    build:
      context: ./backend
      target: test
    volumes:
      - maven-test-cache:/root/.m2
    environment:
      DB_HOST: db
      DB_NAME: litigancia_test
      DB_USER: test
      DB_PASSWORD: test
      SPRING_PROFILES_ACTIVE: test
    depends_on:
      db:
        condition: service_healthy
volumes:
  maven-test-cache:
